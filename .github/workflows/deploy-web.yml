name: Deploy Web Build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless regression tests
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        env:
          XDG_DATA_HOME: /tmp/dam-it-test-data
        run: |
          godot --headless --editor --path . --quit
          timeout 60s godot --headless --path . tests/smoke_test.tscn
          timeout 60s godot --headless --path . tests/story_test.tscn
          timeout 60s godot --headless --path . tests/dialogue_ui_test.tscn
          timeout 60s godot --headless --path . tests/journal_test.tscn
          timeout 60s godot --headless --path . tests/player_visual_test.tscn
          timeout 60s godot --headless --path . tests/narrative_test.tscn
          timeout 60s godot --headless --path . tests/resident_test.tscn
          timeout 60s godot --headless --path . tests/bramble_encounter_test.tscn
          timeout 60s godot --headless --path . tests/ambience_test.tscn
          timeout 60s godot --headless --path . tests/story_boundary_test.tscn

  export:
    name: Export Web build
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Export Web build
        run: |
          mkdir -v -p builds/web
          godot --headless --verbose --export-release "Web" "$(readlink -f builds)/web/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy:
    name: Deploy to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
